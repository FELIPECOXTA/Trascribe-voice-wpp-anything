name: Validate changes
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/separate-ui-api-stitch-20261107]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
